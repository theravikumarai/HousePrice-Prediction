apiVersion: apps/v1
kind: Deployment

metadata:
  name: house-price-backend
  namespace: house-price

spec:
  replicas: 2

  selector:
    matchLabels:
      app: house-price-backend

  template:
    metadata:
      labels:
        app: house-price-backend

    spec:
      containers:
        - name: backend
          image: raviikrds/house-price-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: house-price-secret
                  key: APP_SECRET_KEY

          resources:
              requests:
                cpu: "250m"
                memory: "512Mi"

              limits:
                cpu: "500m"
                memory: "1Gi"
                
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10 
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # -------------------------
  # Test Application
  # -------------------------
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v


  # -------------------------
  # Build and Push Images
  # -------------------------
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs: test

    # Don't push Docker images for Pull Requests
    if: github.event_name == 'push'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # Build and Push Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/house-price-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/house-price-backend:${{ github.sha }}


      # Build and Push Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/house-price-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/house-price-frontend:${{ github.sha }}